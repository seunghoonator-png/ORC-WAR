[package]
name = "orc-war"
version = "0.1.0"
edition = "2021"
# 개발용 보조 실행파일(preview, diagnose, symmetry)이 함께 있어서, 이것이 없으면
# `cargo run` 이 어느 것을 돌릴지 몰라 그 자리에서 멈춘다.
default-run = "orc-war"

[dependencies]
rayon = "1.10"
# 창과 화소 버퍼, 입력을 한꺼번에 해결한다. Windows 에서 win32 를 직접 쓰므로
# 외장/내장 GPU 를 잘못 잡는 하이브리드 노트북 문제를 아예 비켜간다.
minifb = { version = "0.28", optional = true }

[features]
default = ["render"]
# 창이 필요한 것은 이 기능 뒤에 둔다.
# 헤드리스 CI/서버에서는 --no-default-features 로 시뮬만 빌드·테스트한다.
render = ["dep:minifb"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
